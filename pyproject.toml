[project]
name = "corepulse-ia"
version = "1.0.0"
description = "Módulo académico LLM + RAG de CorePulse para ISY0101"
requires-python = ">=3.12"
dependencies = [
  "python-dotenv>=1.0,<2",
  "groq>=0.13.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests/corepulse_ai"]
